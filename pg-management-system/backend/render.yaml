services:
  - type: web
    name: pg-management-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    preDeployCommand: alembic upgrade head
    startCommand: "python -m alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 4 --proxy-headers --forwarded-allow-ips=*"
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: PROJECT_NAME
        value: "Origin PG Management System API"
      - key: DATABASE_URL
        fromDatabase:
          name: pg-management-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: '["https://pg-admin-web-nu.vercel.app"]'
      - key: ADMIN_REGISTRATION_SUPER_KEY
        sync: false
      - key: UPI_PAYEE_VPA
        value: "9886699258-3@ybl"
      - key: UPI_PAYEE_NAME
        value: "SMART GROUP PG'S"
      - key: UPI_BANK_NAME
        value: "Bank of Baroda"
      - key: EMAIL_PROVIDER
        value: "SMTP"
      - key: SMTP_HOST
        value: "smtp.gmail.com"
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM_EMAIL
        sync: false
      - key: SMTP_FROM_NAME
        value: "Origin PG Living"
      - key: SMTP_USE_TLS
        value: "true"

databases:
  - name: pg-management-db
    databaseName: pg_management_prod
    user: pgadmin
    plan: starter

