name: CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  api:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/api } }
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres, POSTGRES_DB: pg_management_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.14", cache: pip, cache-dependency-path: apps/api/requirements-dev.txt }
      - run: pip install -r requirements-dev.txt
      - run: ruff check app tests
      - run: pytest -q -p no:warnings --cov=app --cov-report=term-missing:skip-covered
        env:
          ENVIRONMENT: test
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/pg_management_test
      - run: pip-audit -r requirements.txt
