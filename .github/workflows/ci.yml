name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      api: ${{ steps.filter.outputs.api }}
      mobile: ${{ steps.filter.outputs.mobile }}
      web: ${{ steps.filter.outputs.web }}
      checkout: ${{ steps.filter.outputs.checkout }}
    steps:
      - uses: actions/checkout@v7
      # Pull requests run only the checks for what changed; pushes to main run everything.
      - id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            api:
              - 'apps/api/**'
              - '.github/workflows/**'
            mobile:
              - 'apps/mobile/**'
              - '.github/workflows/**'
            web:
              - 'apps/web/**'
              - 'packages/**'
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/**'
            checkout:
              - 'apps/checkout-web/**'
              - '.github/workflows/**'

  api:
    name: API · lint, tests, audit
    needs: changes
    if: needs.changes.outputs.api == 'true' || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pg_management_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: apps/api/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check app tests
      - name: Tests (PostgreSQL 16)
        run: pytest -q -p no:warnings --cov=app --cov-report=term-missing:skip-covered
        env:
          ENVIRONMENT: test
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/pg_management_test
      - name: Dependency vulnerability audit
        run: pip-audit -r requirements.txt

  api-image:
    name: API · production image
    needs: changes
    if: needs.changes.outputs.api == 'true' || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build image (not pushed)
        uses: docker/build-push-action@v7
        with:
          context: apps/api
          push: false
          tags: pg-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  mobile:
    name: App (iOS / Android / web) · typecheck, lint, build
    needs: changes
    if: needs.changes.outputs.mobile == 'true' || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Production web build
        run: npx expo export -p web --output-dir dist
        env:
          EXPO_PUBLIC_API_URL: https://api.example.invalid

  web:
    name: Landing website · lint, build
    needs: changes
    if: needs.changes.outputs.web == 'true' || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint -w @pg/web
      - name: Build
        run: npm run build -w @pg/web
        env:
          NEXT_PUBLIC_API_URL: https://api.example.invalid
          NEXT_PUBLIC_APP_URL: https://app.example.invalid
          NEXT_TELEMETRY_DISABLED: 1

  checkout:
    name: Payment page · tests, build
    needs: changes
    if: needs.changes.outputs.checkout == 'true' || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/checkout-web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/checkout-web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  ci-passed:
    name: CI passed
    needs: [api, api-image, mobile, web, checkout]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every check that ran to succeed
        run: |
          echo '${{ toJSON(needs) }}' | jq -e 'to_entries | all(.value.result == "success" or .value.result == "skipped")' >/dev/null \
            || { echo "One or more checks failed or were cancelled."; exit 1; }
