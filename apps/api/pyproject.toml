[project]
name = "pg-management-api"
version = "2.0.0"
description = "Origin PG Management System API"
requires-python = ">=3.12"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82", "F811", "F5", "F6", "B006"]  # real-bug rules only; no style/unused-import churn

[tool.ruff.lint.per-file-ignores]
"app/models/*" = ["F821"]   # SQLAlchemy relationships use string forward references
"tests/*" = ["F811", "F821"]  # pytest fixtures are imported by name
